[workspace]
resolver = "3"
members = ["crates/ring"]
exclude = ["template", ".chain"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/itsolaph/poltergift"

[workspace.dependencies]
poltergift-ring = { path = "crates/ring" }
poltergift-model = { path = "crates/model" }
curve25519-dalek = { version = "5", default-features = false, features = ["alloc", "rand_core", "zeroize", "precomputed-tables"] }
blake2 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
rand_core = { version = "0.10", default-features = false }
rand_chacha = { version = "0.10", default-features = false }
zeroize = { version = "1", default-features = false, features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"

[profile.release]
opt-level = 3
